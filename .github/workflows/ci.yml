name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/SurgeSub.Tests/SurgeSub.Tests.csproj -c Release
      - run: python3 -m unittest discover -s tests/packaging -v
  macos:
    name: macOS (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
          - runner: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test tests/SurgeSub.Tests/SurgeSub.Tests.csproj -c Release
      - run: dotnet build src/SurgeSub.App/SurgeSub.App.csproj -c Debug
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
      - run: python3 scripts/package-macos.py
      - name: Verify packaged application
        run: python3 scripts/verify-macos-package.py --rid '${{ matrix.rid }}'
      - uses: actions/upload-artifact@v4
        with:
          name: SurgeSub-${{ matrix.rid }}
          if-no-files-found: error
          path: |
            artifacts/SurgeSub-*.zip
            artifacts/SurgeSub-*.dmg
            artifacts/SurgeSub-*.sha256
  release:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [tests, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: SurgeSub-osx-*
          merge-multiple: true
          path: release-assets
      - name: Verify and publish both architectures
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish-release.py --assets release-assets --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
